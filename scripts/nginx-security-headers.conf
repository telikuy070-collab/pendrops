# Nginx configuration for PenDrops PWA
# Include in your server block or as a separate conf snippet

# Security headers (set at HTTP level, NOT via <meta>)
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Content Security Policy with frame-ancestors (alternative to X-Frame-Options)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://bnzcfhtmzvxxiwfkdryn.supabase.co wss://bnzcfhtmzvxxiwfkdryn.supabase.co; font-src 'self'; frame-ancestors 'none';" always;

# Ensure correct MIME types
types {
  application/javascript js;
  application/wasm wasm;
  application/json json;
  text/css css;
  text/html html;
}

# Cache static assets
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
  expires 1y;
  add_header Cache-Control "public, immutable";
}
