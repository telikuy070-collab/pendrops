name: Deploy to GitHub Pages

# Publishes the built app to GitHub Pages on every push to main.
# The build is the same command CI runs, so what ships is what was tested.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          test -s dist/release-manifest.json
          test -s dist/data/schedule.xls
          test -s dist/data/version.json
          ! grep -q BUILDSTAMP dist/sw.js
          node -e "
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('dist/release-manifest.json', 'utf8'));
            if (!manifest.appVersion || !manifest.schedule?.sha256) {
              console.error('release manifest is incomplete');
              process.exit(1);
            }
            console.log('artifact ok: version=' + manifest.appVersion + ' sha=' + manifest.sourceSha);
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
