name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'
  CI: true

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit Tests (Vitest, root only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # vitest.config.ts is the root-only discovery config: it excludes
      # .kilo/ worktrees and the separate pendrops-Teacher repository.
      - run: npm run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            test-results/
            coverage/

  parser-fixture-gate:
    name: Parser Fixture Gate (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # Informational only. The fail-closed gate exits 1 while any fixture is
      # BLOCKED (for example a missing human-reviewed oracle) or below
      # threshold. This job is advisory by construction: it is deliberately
      # NOT listed in build.needs, so it gates neither the build nor the
      # deploy. The report is always printed for the PR.
      - name: Parser quality report (always printed)
        run: npm run test:parser:fixtures:report
      - name: Parser quality gate (advisory, non-blocking)
        if: always()
        continue-on-error: true
        run: npm run test:parser:fixtures

  edge-tests:
    name: Edge Case Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:edge

  store-audit:
    name: Store Audit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:store

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:security

  # Matrix testing across Node versions
  matrix-test:
    name: Matrix Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22', '24']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  # Security scanning
  # NOTE: advisory only. `npm audit --audit-level=high` cannot be made a hard
  # gate today because the pinned xlsx devDependency carries unfixed upstream
  # advisories; this job reports them and is deliberately not in build.needs.
  npm-audit:
    name: npm audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  # Dependency review for PRs
  dependency-review:
    name: Dependency Review
    # Advisory only. The deploy gate keys off the overall CI workflow
    # conclusion, so a red dependency review would block publication of an
    # otherwise green build. This is a signal for the reviewer, not a
    # publication blocker. The job still runs and reports.
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  # Build with caching
  build:
    name: Build (Vite + TypeScript)
    runs-on: ubuntu-latest
    needs: [typecheck, test, edge-tests, store-audit, security-audit, matrix-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # The tracked schedule snapshot must be packaged, otherwise the PWA has
      # no offline schedule. The build itself is fail-closed; this asserts the
      # artifacts that are actually uploaded.
      - name: Verify packaged release artifacts
        run: |
          set -euo pipefail
          test -s dist/data/schedule.xls
          test -s dist/data/version.json
          test -s dist/release-manifest.json
          test -s dist/sw.js
          node -e "const m=require('./dist/release-manifest.json');if(!m.appVersion||!m.schedule.sha256)process.exit(1);console.log('release manifest ok:',m.appVersion)"
          grep -q "schedule-pwa-" dist/sw.js
          ! grep -q "BUILDSTAMP" dist/sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Bundle Analysis
  analyze:
    name: Bundle Analysis
    # Advisory only. Same rationale as lighthouse: the deploy gate keys off
    # the overall CI workflow conclusion, so the size threshold is a signal
    # for maintainers, not a publication blocker. The job still runs and
    # uploads bundle-report.json.
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx vite-bundle-analyzer dist --json > bundle-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: bundle-report.json
      - run: |
          SIZE=$(cat bundle-report.json | jq '.totalSize')
          if [ $SIZE -gt 250000 ]; then
            echo "Bundle too large: $SIZE bytes"
            exit 1
          fi

  # Bundle size check
  bundle-size:
    name: Bundle Size Check
    # Advisory only. The deploy gate keys off the overall CI workflow
    # conclusion, so the 200KB gzipped budget is a signal for maintainers,
    # not a publication blocker. The job still runs and reports.
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Check bundle sizes
        run: |
          echo "=== Bundle Size Report ==="
          find dist -name "*.js" -o -name "*.css" | xargs ls -lh
          echo ""
          echo "=== Gzipped sizes ==="
          find dist -name "*.js" -o -name "*.css" | xargs gzip -c | wc -c
          # Fail if main JS bundle > 200KB gzipped.
          # The Vite entry chunk is emitted as assets/main-<hash>.js (there is
          # no index-*.js asset), so this glob has to match main-*.js for the
          # limit to be enforced at all.
          MAIN_JS=$(find dist/assets -name "main-*.js" | head -1)
          if [ -f "$MAIN_JS" ]; then
            SIZE=$(gzip -c "$MAIN_JS" | wc -c)
            echo "Main JS gzipped: $SIZE bytes"
            if [ $SIZE -gt 204800 ]; then
              echo "::error::Main JS bundle exceeds 200KB gzipped ($SIZE bytes)"
              exit 1
            fi
          fi

  # Lighthouse CI for performance budget
  lighthouse:
    name: Lighthouse CI
    # Advisory only. Lighthouse is flaky on shared runners (CPU throttling,
    # preview-server startup timing), and the deploy gate keys off the overall
    # CI workflow conclusion, so a red lighthouse run would otherwise block
    # publication of an otherwise green build. The job still runs and reports;
    # its failure does not fail the workflow.
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Setup Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x
      - name: Run Lighthouse CI
        run: |
          cat > lighthouserc.json << 'EOF'
          {
            "ci": {
              "collect": {
                "numberOfRuns": 3,
                "startServerCommand": "npx vite preview --port 3000 --strictPort",
                "url": ["http://localhost:3000/pendrops/"],
                "settings": {
                  "headless": true,
                  "preset": "desktop"
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["error", { "minScore": 0.9 }],
                  "categories:accessibility": ["error", { "minScore": 0.9 }],
                  "categories:best-practices": ["error", { "minScore": 0.9 }],
                  "categories:seo": ["error", { "minScore": 0.8 }],
                  "first-contentful-paint": ["error", { "maxNumericValue": 2000 }],
                  "largest-contentful-paint": ["error", { "maxNumericValue": 2500 }],
                  "total-blocking-time": ["error", { "maxNumericValue": 300 }],
                  "cumulative-layout-shift": ["error", { "maxNumericValue": 0.1 }],
                  "interactive": ["error", { "maxNumericValue": 3500 }]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF
          lhci autorun

  # E2E tests with Playwright
  e2e:
    name: E2E Tests (Playwright)
    # Advisory only. Same rationale as lighthouse: browser/service-worker E2E
    # is timing-sensitive on shared runners, and the deploy gate keys off the
    # overall CI workflow conclusion, so this must not be able to block
    # publication. The job still runs and reports; failure is non-fatal.
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install Playwright
        run: |
          npm install -g @playwright/test@latest
          npx playwright install --with-deps chromium
      - name: Start preview server
        # `vite preview` honours the production base (/pendrops/), so the SW
        # scope, precache and offline behaviour are tested at the real path.
        run: |
          npx vite preview --port 3000 --strictPort &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/pendrops/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "preview server did not start"
          exit 1
      - name: Run Playwright tests
        run: |
          cat > e2e.test.js << 'EOF'
          const { test, expect } = require('@playwright/test');
          const BASE = 'http://localhost:3000/pendrops/';

          test.describe('PenDrops PWA', () => {
            test('loads and shows schedule', async ({ page }) => {
              await page.goto(BASE);
              await expect(page.locator('#scheduleContainer')).toBeVisible({ timeout: 10000 });
            });

            test('service worker registers at the deployed scope', async ({ page }) => {
              await page.goto(BASE);
              const scope = await page.evaluate(async () => {
                const reg = await navigator.serviceWorker.ready;
                return reg.scope;
              });
              expect(scope).toBe(BASE);
            });

            test('critical precache is fail-closed and complete', async ({ page }) => {
              await page.goto(BASE);
              await page.evaluate(async () => {
                await navigator.serviceWorker.ready;
              });
              // The worker activates only when every critical asset was cached.
              const cached = await page.evaluate(async () => {
                const names = await caches.keys();
                const urls = [];
                for (const name of names) {
                  const cache = await caches.open(name);
                  for (const request of await cache.keys()) urls.push(new URL(request.url).pathname);
                }
                return urls;
              });
              expect(cached).toContain('/pendrops/index.html');
              expect(cached).toContain('/pendrops/data/schedule.xls');
              expect(cached).toContain('/pendrops/data/version.json');
            });

            test('manifest loads', async ({ page }) => {
              await page.goto(BASE);
              const manifestLink = page.locator('link[rel="manifest"]');
              await expect(manifestLink).toHaveAttribute('href', /manifest\.json/);
            });

            test('offline capability', async ({ page }) => {
              await page.goto(BASE);
              await page.waitForFunction(
                () => navigator.serviceWorker.controller,
                null,
                { timeout: 20000 }
              );
              await page.waitForLoadState('networkidle');
              await page.context().setOffline(true);
              // The precached bundle must still be served by the worker.
              const served = await page.evaluate(async () => {
                const script = document.querySelector('script[type=module][src]');
                const response = await fetch(script.src);
                return { ok: response.ok, size: (await response.text()).length };
              });
              expect(served.ok).toBe(true);
              expect(served.size).toBeGreaterThan(1000);
              await page.context().setOffline(false);
            });
          });
          EOF
          npx playwright test e2e.test.js --reporter=line

  # CodeQL analysis (security)
  codeql:
    name: CodeQL Analysis
    # Advisory only. The deploy gate keys off the overall CI workflow
    # conclusion, so a CodeQL finding must not block publication on its own.
    # The job still runs and uploads security events; findings are reviewed
    # separately, and the fail-closed security-audit job is unchanged.
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{matrix.language}}'
