<div class="hero {{heroClass}}">
  <div class="hero-icon">{{icon}}</div>
  <div class="hero-body">
    <div class="hero-title">{{title}}</div>
    <div class="hero-sub">Первая пара через <span class="countdown">—</span></div>
    <div class="hero-sub"><b>{{subject}}</b> в <b>{{time}}</b></div>
  </div>
</div>
