<section class="day {{dayClass}}" data-day="{{day}}" data-status="{{status}}">
  <header class="day-header">
    <div class="day-title-block">
      <div class="day-title">{{day}}</div>
      <div class="day-badge" data-if="isToday">Сегодня</div>
    </div>
    <div class="day-count">{{count}} {{dayWord}}</div>
  </header>
  <div class="hero" data-if="hero"></div>
  <div class="cards"></div>
</section>
